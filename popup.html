<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { font-size: 15px; margin-bottom: 14px; color: #a78bfa; letter-spacing: 1px; }

    .display {
      text-align: center;
      margin-bottom: 12px;
    }
    .cents {
      font-size: 36px;
      font-weight: bold;
      color: #c4b5fd;
      line-height: 1;
    }
    .label { font-size: 11px; color: #888; margin-top: 2px; }
    .semitone { font-size: 13px; color: #a78bfa; margin-top: 4px; }

    input[type=range] {
      width: 100%;
      margin: 10px 0;
      accent-color: #7c3aed;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 6px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-down { background: #4338ca; color: #fff; }
    .btn-reset { background: #374151; color: #ccc; }
    .btn-up   { background: #7c3aed; color: #fff; }

    .fine-buttons {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .fine-buttons button {
      font-size: 11px;
      padding: 4px 0;
      background: #1e1b4b;
      color: #a78bfa;
      border: 1px solid #3730a3;
    }

    .engine {
      display: flex;
      gap: 0;
      margin-top: 14px;
      border: 1px solid #3730a3;
      border-radius: 8px;
      overflow: hidden;
    }
    .eng-btn {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 0;
      background: #1e1b4b;
      color: #8b86b8;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }
    .eng-btn span {
      display: block;
      font-size: 9px;
      font-weight: 400;
      opacity: 0.7;
    }
    .eng-btn.active {
      background: #7c3aed;
      color: #fff;
    }
    .engine-note {
      font-size: 10px;
      color: #6b6b8a;
      text-align: center;
      margin-top: 6px;
      min-height: 12px;
    }

    .enhance {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #2a2a45;
    }
    .enhance h2 {
      font-size: 11px;
      color: #a78bfa;
      margin-bottom: 8px;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .eq-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .eq-row label {
      width: 36px;
      font-size: 11px;
      color: #b8b8d0;
      flex-shrink: 0;
    }
    .eq-row input[type=range] {
      flex: 1;
      margin: 0;
    }
    .eq-row .val {
      width: 38px;
      text-align: right;
      font-size: 11px;
      color: #c4b5fd;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .enhance-note {
      font-size: 10px;
      color: #6b6b8a;
      margin-top: 8px;
      line-height: 1.4;
    }
    .enhance-reset {
      width: 100%;
      margin-top: 8px;
      padding: 5px 0;
      font-size: 11px;
      background: #374151;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>🎵 Pitch Shifter</h1>

  <div class="display">
    <div class="cents" id="centsDisplay">0</div>
    <div class="label">セント (100 = 半音1個)</div>
    <div class="semitone" id="semitoneDisplay">±0 半音</div>
  </div>

  <input type="range" id="slider" min="-1200" max="1200" step="1" value="0">

  <div class="buttons">
    <button class="btn-down" id="downBtn">▼ 半音</button>
    <button class="btn-reset" id="resetBtn">リセット</button>
    <button class="btn-up"   id="upBtn">▲ 半音</button>
  </div>

  <div class="fine-buttons">
    <button id="down10">−10¢</button>
    <button id="down1">−1¢</button>
    <button id="up1">+1¢</button>
    <button id="up10">+10¢</button>
  </div>

  <div class="engine">
    <button id="engJungle" class="eng-btn active">Jungle<span>軽量・低遅延</span></button>
    <button id="engWsola" class="eng-btn">WSOLA<span>高音質</span></button>
  </div>
  <div class="engine-note" id="engineNote"></div>

  <div class="enhance">
    <h2>🎚️ 音質強化</h2>
    <div class="eq-row">
      <label>低音</label>
      <input type="range" id="bass" min="-12" max="12" step="1" value="0">
      <span class="val" id="bassVal">0 dB</span>
    </div>
    <div class="eq-row">
      <label>中音</label>
      <input type="range" id="mid" min="-12" max="12" step="1" value="0">
      <span class="val" id="midVal">0 dB</span>
    </div>
    <div class="eq-row">
      <label>高音</label>
      <input type="range" id="treble" min="-12" max="12" step="1" value="0">
      <span class="val" id="trebleVal">0 dB</span>
    </div>
    <div class="eq-row">
      <label>広がり</label>
      <input type="range" id="width" min="0" max="200" step="5" value="100">
      <span class="val" id="widthVal">100%</span>
    </div>
    <button class="enhance-reset" id="enhanceReset">音質強化をリセット</button>
    <div class="enhance-note">低音を大きく上げると歪む場合があります（リミッター未搭載）。気になれば下げてください。</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
